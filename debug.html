<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开屏动画 · 调试版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #111; font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }

  /* 2×2 分屏；每一格模拟一块"透明桌面" */
  #grid { display: grid; grid-template: 1fr / 1fr; height: 100%; }
  #grid.solo { display: block; }
  #grid.solo .pane { display: none; height: 100%; }
  #grid.solo .pane.on { display: block; }

  .pane { position: relative; overflow: hidden; }
  body[data-bg="0"] .pane { background: linear-gradient(135deg, #e9edf3 0%, #cfd8e6 55%, #b9c6da 100%); }
  body[data-bg="1"] .pane { background: radial-gradient(120% 120% at 15% 10%, #ffd9a8 0%, #f29a8a 35%, #7a6ad8 75%, #2b3a8c 100%); }
  body[data-bg="2"] .pane { background: #ffffff; }
  body[data-bg="3"] .pane { background: linear-gradient(160deg, #26303f 0%, #10151d 100%); }

  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .tag { position: absolute; left: 12px; top: 10px; z-index: 3; font-size: 12px; letter-spacing: .08em;
         color: #111; background: rgba(255,255,255,.72); padding: 3px 9px; border-radius: 999px;
         backdrop-filter: blur(6px); user-select: none; }

  /* 占位用的 App 前端：以后换成真正的界面 */
  .app { position: absolute; opacity: 0; background: #fafafa; overflow: hidden; display: grid;
         grid-template-columns: 18% 1fr; color: #111; box-shadow: 0 18px 60px rgba(0,0,0,.28); }
  .app aside { background: #111; padding: 9% 12%; display: flex; flex-direction: column; gap: 6%; }
  .app aside i { display: block; height: 3.2%; min-height: 6px; border-radius: 99px; background: rgba(255,255,255,.22); }
  .app aside i:first-child { width: 46%; height: 5%; background: #fff; margin-bottom: 14%; }
  .app aside i:nth-child(3) { background: rgba(255,255,255,.8); }
  .app main { padding: 5% 6%; display: flex; flex-direction: column; gap: 5%; min-width: 0; }
  .app h1 { font-size: clamp(13px, 2.6cqh, 26px); font-weight: 600; letter-spacing: -.01em; }
  .app p { font-size: clamp(10px, 1.6cqh, 14px); color: #777; margin-top: .4em; }
  .app .cards { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1.4fr; gap: 4%; }
  .app .cards b { border-radius: 10px; background: #ececec; }
  .app .cards b:nth-child(1) { background: #111; }
  .app .cards b:nth-child(4) { grid-column: span 2; }
  .pane { container-type: size; }

  #hud { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 9; font-size: 12px;
         color: #eee; background: rgba(0,0,0,.62); padding: 5px 14px; border-radius: 14px;
         backdrop-filter: blur(8px); width: max-content; max-width: calc(100vw - 16px); text-align: center; line-height: 1.7; user-select: none; }
  #hud kbd { font: inherit; font-weight: 600; color: #fff; }
  #hud input { width: 110px; vertical-align: middle; accent-color: #fff; }
  #bar { display: flex; align-items: center; gap: 10px; min-width: min(560px, 100vw - 60px); }
  #bar #seek { flex: 1; width: auto; }
  #play { all: unset; cursor: pointer; width: 1.6em; text-align: center; color: #fff; }
  #seekOut { width: 4em; text-align: right; font-variant-numeric: tabular-nums; }
  #rateOut { display: inline-block; width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-bg="0">
<div id="grid"></div>
<div id="hud"><div id="bar"><button id="play" title="暂停 / 继续 (P)">❚❚</button><input id="seek" type="range" min="0" max="9" step="0.01" value="0"><span id="seekOut"></span></div><kbd>R</kbd> 重播　<kbd>P</kbd> 暂停　<kbd>← →</kbd> 逐帧　<kbd>B</kbd> 换桌面底图　<kbd>空格</kbd> 停在液滴 / 放行　<kbd>[ ]</kbd> 倍速 <input id="rate" type="range" min="0.1" max="2" step="0.05"> <span id="rateOut"></span></div>

<script>
/* ---------- 时间线（秒） ---------- */
const T1 = 2.2;          // 飞入 + 螺旋结束，两道光在中心相遇
const INTRO_END = 3.4;   // 最早允许展开的时刻（保证液滴至少完整出现一下）
const DEMO_LOAD = 5.2;   // 模拟"加载完成"的时刻
const REST = 2.6;        // 展开结束后停留多久再自动重播

/* ---------- 四个样板 ---------- */
const VARIANTS = [
  { name: 'A 丝带', E1: .70, E2: .50,
    def: { H0: .034, TAILLEN: 4.5, TW: 1.0, TAPER: 1.15, BLUR: .018, BOB: .012, KS: .04 } },
];

const VERT = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;

const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform float uT;    // 开屏开始后的秒数
uniform float uQ1;   // 展开·铺满阶段进度 0..1，未开始为 -1
uniform float uQ2;   // 展开·揭开阶段进度 0..1

const float T1 = ${T1.toFixed(2)};
const float RD = .105;   // 液滴半径（以屏幕高度为 1）
const float M  = .06;    // App 窗口到屏幕边缘的留白
const float RC = .03;    // App 窗口圆角
const int   N  = 28;     // 尾迹分段数
const float TAU = 6.2831853;

float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.) / k; return min(a, b) - h*h*k*.25; }
float ease(float x){ x = clamp(x, 0., 1.); return x < .5 ? 4.*x*x*x : 1. - pow(-2.*x + 2., 3.) * .5; }
float rbox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }

float startAngle(){ return atan(-uRes.y, -uRes.x); }   // 指向左下角

// 轨迹分两段，像两颗星体的引力相遇：
//   1) t < TA：沿缓弧冲入，瞄准的不是中心而是偏开 PERI 的一点，于是两者擦肩而过；
//   2) t ≥ TA：被对方俘获，立刻向内拐、互绕，轨道收紧、转速在最后急剧加快，直到相撞。
// 擦肩那一刻速度方向正好是切向，所以两段的位置和速度都连续。
const float TA   = 1.2;    // 擦肩而过的时刻
const float PERI = .075;   // 擦肩时离中心的距离
const float V0   = .45;    // 擦肩时的速度
const float DEC  = .50;    // 冲入阶段的减速量（越大入场越快）
const float SPIN = 3.0;    // 末段额外加速转过的弧度
const float ARC  = .40;    // 入场弧线的弯曲程度（0 为直线）
const float CONV = 1.7;    // 互绕收拢的早晚：越接近 1 越早向内拐，越大越晚
vec2 path(float t){
  vec2 dir = normalize(uRes);          // 左下 → 右上
  vec2 per = vec2(-dir.y, dir.x);     // 从行进方向的左侧绕过中心，之后顺时针互绕（与参考图一致）
  // 入场走一条缓弧：离擦肩越早，越偏向轨道内侧，弯曲方向与之后的互绕一致
  if (t < TA) { float k = TA - t; return per * (PERI - ARC * k * k) - dir * (V0 * k + DEC * k * k); }
  float T2 = T1 - TA;
  float u  = min((t - TA) / T2, 1.);

  float r  = PERI * (1. - pow(u, CONV));   // 擦肩后不再向外甩，立刻向内收
  float a  = atan(per.y, per.x) - V0 / PERI * T2 * u - SPIN * pow(u, 4.);
  return r * vec2(cos(a), sin(a));
}
float endAngle(){ vec2 d = normalize(uRes); return atan(d.x, -d.y) - V0 / PERI * (T1 - TA) - SPIN; }

// 头部（清晰）+ 逐渐收细的尾迹（单独返回，越靠尾尖越模糊）。dTail：到尾迹的距离，fTail：最近处在尾迹上的位置 0..1
float comet(vec2 p, float tau, out float dTail, out float fTail){
  float g    = smoothstep(.86, 1., tau / T1);          // 相撞前头部鼓起、尾巴收回
  float hr   = mix(H0, RD * .8, g);
  vec2  a    = path(tau);
  // 水滴形：尾长按头部半径的倍数给定，再除以当前速度换算成时间，快慢都保持同样的形状
  float sp   = max(length(a - path(tau - .02)) / .02, .3);
  float len  = TAILLEN * H0 * (1. - g);
  float tm   = tau - .5 * len / sp;                       // 尾巴中段所在的时刻：那里的速度可能和头部不同
  sp = .5 * (sp + max(length(path(tm) - path(tm - .02)) / .02, .3));
  float dt   = len / sp / float(N);
  vec2  hp   = a;
  float head = length(p - a) - hr;
  // 先找尾巴中心线上离本像素最近的一点（位置 fn 在空间上连续变化），再按该处的粗细求距离。
  // 这样粗细和模糊量都平滑过渡，不会出现一节一节的条纹。
  float dc = 1e3, fn = 0.;
  vec2  qn = a;
  for (int i = 1; i <= N; i++){
    vec2  b  = path(tau - dt * float(i));
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0., 1.);
    float ds = length(pa - ba * h);
    if (ds < dc) { dc = ds; fn = (float(i) - 1. + h) / float(N); qn = a + ba * h; }
    a = b;
  }
  dTail = dc - hr * TW * pow(1. - fn, TAPER);
  // 模糊量取"沿尾巴的位置"和"离头部的实际距离"中较小的一个：尾巴卷在头部周围时不会糊成一圈光晕
  fTail = min(fn, length(qn - hp) / (TAILLEN * H0)) * (1. - g);
  return head;
}

// 拖尾覆盖度：模糊宽度沿尾巴线性变宽，同时逐渐变淡，所以头部清晰、尾尖化开
float tailCov(float d, float f, float px){
  float b = BLUR * smoothstep(.1, 1., f);   // 靠近头部的一段保持实心，水滴形不被吃掉
  return (1. - smoothstep(-px - 1.3 * b, px + .7 * b, d)) * (1. - f * f * f);
}

#if V == 1
// 墨滴：尾迹后面甩出几颗小液珠，稍后被吸回主体
float beads(vec2 p, float tau){
  float d = 1e3;
  for (int j = 0; j < 3; j++){
    float lag = TAIL * (1.15 + .5 * float(j));
    vec2 c = path(min(tau - lag, T1));
    d = min(d, length(p - c) - (.017 - .004 * float(j)));
  }
  return d;
}
#endif

// 液滴表面的波动（相对半径的比例）
float wob(float th, float t){
#if V == 0
  return .035*sin(2.*th + 1.1*t) + .020*sin(3.*th - 1.7*t);
#elif V == 1
  return .070*sin(2.*th + .9*t) + .040*sin(3.*th - 1.3*t) + .020*sin(4.*th + 2.*t);
#elif V == 2
  return .022*sin(3.*th + 2.2*t) + .015*sin(5.*th - 3.1*t) + .009*sin(8.*th + 4.3*t);
#else
  return pow(abs(cos(4.5*th + .25*t)), 4.) * (.13 + .07*sin(2.6*t)) + .02*sin(2.*th + t);
#endif
}

float blob(vec2 p, float R, float amp){
  return length(p) - R * (1. + amp * wob(atan(p.y, p.x), uT));
}

// 融合后的悬浮液滴：回弹 + 两瓣余振 + 持续波动 + 上下浮动
float idle(vec2 p){
  float u = max(uT - T1, 0.);
  float spring = 1. - .2 * exp(-2.6*u) * cos(5.5*u);      // 相撞后的回弹：放缓，一两下就稳住
  p.y -= BOB * sin(u * 1.3) * smoothstep(0., 2., u);
  float th = atan(p.y, p.x);
  float am = endAngle() - 3. * (1. - exp(-1.5 * u));   // 相撞后带着余下的自旋慢慢停住
  float lobe = .20 * exp(-2.2*u) * sin(4.6*u) * cos(2.*(th - am));
  return length(p) - RD * spring * (1. + smoothstep(0., .6, u) * wob(th, uT) + lobe);
}

void main(){
  float S    = min(uRes.x, uRes.y);   // 以短边为 1，竖屏窗口也不会撑破
  vec2  p    = (gl_FragCoord.xy - .5 * uRes) / S;
  float px   = 1.2 / S;
  vec2  HW   = .5 * uRes / S - M;
  float diag = length(HW) + .06;
  float win  = rbox(p, HW, RC);
  float d;
  float fade = 1.;
  float soft = 0.;   // 拖尾的模糊覆盖度

  if (uQ1 < 0.) {
    // ---- 飞入 / 螺旋 / 融合 / 等待 ----
    if (uT < T1) {
      float t1, f1, t2, f2;
      float h1 = comet(p, uT, t1, f1), h2 = comet(-p, uT, t2, f2);
      d = smin(h1, h2, KS);
      soft = max(tailCov(t1, f1, px), tailCov(t2, f2, px));
    }
    else         d = idle(p);
#if V == 1
    d = smin(d, min(beads(p, uT), beads(-p, uT)), .03);
#endif
  } else if (uQ2 <= 0.) {
    // ---- 展开：液滴铺满 App 窗口 ----
    float q = uQ1;
    float start = smoothstep(0., .25, q);
#if V == 0
    float k = ease(q);
    d = mix(idle(p), rbox(p, mix(vec2(RD), HW, k), mix(RD, RC, k)), start);
#elif V == 1
    float R = mix(RD, diag * 1.12, pow(q, 2.5));
    d = max(mix(idle(p), blob(p, R, mix(1., .35, q)), start), win);
#elif V == 2
    float k1 = ease(q * 2.), k2 = ease(q * 2. - 1.);
    vec2 b = vec2(mix(RD, HW.x, k1), mix(mix(RD, .004, k1), HW.y, k2));
    float r = min(min(b.x, b.y), mix(RD, RC, k2));
    d = mix(idle(p), rbox(p, b, r), start);
#else
    float pinch = 1. - .3 * sin(3.14159 * clamp(q / .35, 0., 1.));
    float k = clamp((q - .35) / .65, 0., 1.);
    float R = mix(RD * pinch, diag * 1.25, k * k * k);
    d = max(mix(idle(p), blob(p, R, 1.), start), win);
#endif
  } else {
    // ---- 揭开：黑色退场，露出 App ----
    float q = ease(uQ2);
#if V == 0
    d = win; fade = 1. - q;
#elif V == 1
    float edge = mix(HW.y + .12, -HW.y - .12, q)
               + sin(3.14159 * uQ2) * (.035*sin(p.x*7. + uT*3.) + .02*sin(p.x*13. - uT*4.));
    d = max(win, p.y - edge);
#elif V == 2
    d = max(win, q * (HW.y + .01) - abs(p.y));
#else
    d = max(win, -blob(p, q * diag * 1.25, 1.));
#endif
  }

  float a = max(1. - smoothstep(-px, px, d), soft) * fade;
  gl_FragColor = vec4(0., 0., 0., a);   // 纯黑 + 透明
}`;

/* ---------- 搭建四格 ---------- */
const grid = document.getElementById('grid');
const panes = VARIANTS.map((v, i) => {
  const el = document.createElement('div');
  el.className = 'pane';
  el.innerHTML = `
    <div class="app"><aside><i></i><i></i><i></i><i></i><i></i></aside>
      <main><div><h1>App 前端占位</h1><p>加载完成后从液滴展开</p></div>
      <div class="cards"><b></b><b></b><b></b><b></b><b></b></div></main></div>
    <canvas></canvas>`;
  grid.appendChild(el);
  const canvas = el.querySelector('canvas');
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
  const defs = `#define V ${i}\n` + Object.entries(v.def).map(([k, x]) => `#define ${k} ${Number(x).toFixed(4)}`).join('\n') + '\n';
  const prog = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, defs + FRAG]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(v.name, gl.getShaderInfoLog(s));
    gl.attachShader(prog, s);
  }
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  return { v, el, canvas, gl, app: el.querySelector('.app'), uRes: U('uRes'), uT: U('uT'), uQ1: U('uQ1'), uQ2: U('uQ2') };
});

/* ---------- 时钟与对外接口 ---------- */
const params = new URLSearchParams(location.search);
const freeze = params.has('freeze') ? parseFloat(params.get('freeze')) : null;
const RATE = 2;   // 成品速度：时间线里的 1 秒在屏幕上播 0.5 秒
let clock = 0, last = performance.now(), speed = 1, finishAt = null, hold = false;   // clock：按倍速累计的动画时间

function restart() { clock = 0; finishAt = null; }
const rate = document.getElementById("rate"), rateOut = document.getElementById("rateOut");
function setSpeed(x) { speed = Math.min(2, Math.max(0.1, Math.round(x * 20) / 20)); rate.value = speed; rateOut.textContent = speed.toFixed(2) + "×"; }
rate.addEventListener("input", () => setSpeed(+rate.value));
setSpeed(params.has("speed") ? parseFloat(params.get("speed")) : speed);

// 进度条：拖动时暂停并直接定位到那一刻；"加载完成"按演示时刻重新判定，所以来回拖都一致
let paused = false, scrubbing = false;
const seek = document.getElementById("seek"), seekOut = document.getElementById("seekOut"), playBtn = document.getElementById("play");
seek.max = (DEMO_LOAD + VARIANTS[0].E1 + VARIANTS[0].E2 + REST).toFixed(2);
function setPaused(x) { paused = x; playBtn.textContent = paused ? "▶" : "❚❚"; }
seek.addEventListener("pointerdown", () => { scrubbing = true; });
addEventListener("pointerup", () => { scrubbing = false; });
seek.addEventListener("input", () => { clock = +seek.value; hold = false; finishAt = clock >= DEMO_LOAD ? DEMO_LOAD : null; });
playBtn.addEventListener("click", () => setPaused(!paused));
// 真正的 App 加载完后调用这一句，液滴就会展开
window.splash = { finish() { if (finishAt === null) finishAt = clock; }, restart };

function frame() {
  const now = performance.now();
  if (!paused && !scrubbing) clock += Math.min(now - last, 100) / 1000 * speed * RATE;   // 切到后台再回来时不跳帧
  last = now;
  if (!scrubbing) seek.value = clock;
  seekOut.textContent = (clock / RATE).toFixed(2) + " s";   // 显示成品速度下的实际秒数
  const t = freeze !== null ? freeze : clock;
  if (finishAt === null && !hold && t >= DEMO_LOAD) finishAt = DEMO_LOAD;   // 模拟加载
  const expandAt = finishAt === null ? Infinity : Math.max(finishAt, INTRO_END);
  const e = t - expandAt;
  let done = true;

  for (const P of panes) {
    const { gl, canvas, v } = P;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (!w || !h) continue;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h);
      const ch = Math.min(canvas.clientWidth, canvas.clientHeight), m = .06 * ch;
      P.app.style.inset = m + 'px'; P.app.style.borderRadius = .03 * ch + 'px';
    }
    const q1 = e < 0 ? -1 : Math.min(e / v.E1, 1);
    const q2 = e < v.E1 ? 0 : Math.min((e - v.E1) / v.E2, 1);
    if (e < v.E1 + v.E2 + REST) done = false;
    P.app.style.opacity = e >= v.E1 ? 1 : 0;
    gl.uniform2f(P.uRes, w, h); gl.uniform1f(P.uT, t); gl.uniform1f(P.uQ1, q1); gl.uniform1f(P.uQ2, q2);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (q2 < 1) gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  if (done && freeze === null && !paused && !scrubbing) restart();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- 按键 ---------- */
function solo(i) {
  grid.classList.toggle('solo', i >= 0);
  panes.forEach((P, j) => P.el.classList.toggle('on', j === i));
}
addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (k === 'r') restart();
  else if (k === 'p') setPaused(!paused);
